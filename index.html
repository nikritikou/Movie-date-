
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Date</title>

    <style>
        body {
            background-color: #650e25;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            text-align: center;
        }

        #content {
            padding: 25px;
        }

        h1 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 30px;
        }

        button {
            background: transparent;
            color: white;
            border: 1px solid white;
            border-radius: 8px;
            padding: 14px 35px;
            margin: 8px;
            font-size: 22px;
            cursor: pointer;
        }

        button:active {
            background: white;
            color: #650e25;
        }
    </style>
</head>

<body>

    <div id="content">
        <h1 id="question">θα ήθελες να δούμε ταινία μαζί;</h1>

        <div id="buttons">
            <button onclick="wrong()">ναι</button>
            <button onclick="correct()">ΝΑΙ</button>
        </div>
    </div>

    <script>
        function wrong() {
            document.getElementById("question").textContent =
                "έπρεπε να είχες απαντήσει ΝΑΙ";
        }

        function correct() {
            document.getElementById("question").textContent =
                "σωστή απάντηση🤍";

            document.getElementById("buttons").style.display =
                "none";
        }
    </script>

</body>
</html>
