
<!DOCTYPE html>
<html lang="el">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Date ❤️</title>

    <style>
        body {
            background: linear-gradient(135deg, #ffdce7, #f7b9d2);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;

            min-height: 100vh;

        h1 {

            cursor: pointer;
        }

<body>

    <div id="content">
        <div style="font-size: 60px;">🍿🎬</div>

        <h1>Θέλεις να δούμε ταινία;</h1>

        <button onclick="yes()">ναι</button>
        <button onclick="yes()">ΝΑΙ</button>
    </div>

    <script>
        function yes() {
            document.getElementById("content").innerHTML =
                "<h1>Τέλεια! Ραντεβού για ταινία!</h1>" +
                "<div style='font-size: 80px;'>❤️</div>";
        }
    </script>

</body>
</html>
